name: Comparison sources

# SP-COMPARISON-PAGE G6: once a week, check that every source of
# docs/comparison.md still answers and that no reading is older than the
# freshness rule. A failure opens (or refreshes) one issue listing the dead
# or stale cells; the page itself is never edited here.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: comparison-check
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check comparison sources
    runs-on: ${{ vars.REPOACH_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install the checker's dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyyaml>=6.0" "pydantic>=2.7"

      - name: Check every source
        id: check
        run: |
          set +e
          python scripts/gen_comparison.py --check-only > comparison-check.txt 2>&1
          code=$?
          cat comparison-check.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or refresh the issue
        if: steps.check.outputs.code == '1' || steps.check.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.check.outputs.code }}
        run: |
          title="docs/comparison.md: dead or stale sources"
          {
            echo "\`python scripts/gen_comparison.py --check-only\` exited $CODE on $(date -u +%F)."
            echo
            echo '```'
            cat comparison-check.txt
            echo '```'
            echo
            echo "Re-read each page, update docs/comparison.yaml, re-render with the script and commit both files."
          } > issue-body.md
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file issue-body.md
          else
            gh issue create --title "$title" --body-file issue-body.md
          fi

      - name: Fail when the check could not decide
        if: steps.check.outputs.code == '2'
        run: |
          echo "::error::comparison check could not say (network or YAML); retry"
          exit 1
