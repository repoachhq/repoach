name: CI

on:
  push:
    # SP-CI-JOBS-NO-OP-WHEN-NOT-AFFECTED D7 (owner decision 2026-11-16):
    # a push to develop or main runs every step (mode full), so a red a
    # narrowed pull request let through shows on the next develop head;
    # the concurrency group below keeps only the latest head of each.
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# SP-CONFIG-ENV-ANCHOR made llm_proxy_base_url fail-loud: Settings now
# refuses to default to a wrong proxy, so every environment must anchor
# the value. CI checks out no .env, so it is anchored here for the whole
# workflow (loopback; the suite mocks the gateway, the smoke boots the
# server which never dials this URL). Step-level env blocks inherit it.
# REPOACH_AFFECTED_JOBS_TABLE is the one place the path-to-job table is
# named (SP-CI-JOBS-NO-OP-WHEN-NOT-AFFECTED D1).
env:
  REPOACH_LLM_PROXY_BASE_URL: http://127.0.0.1:8082
  REPOACH_AFFECTED_JOBS_TABLE: .github/affected-jobs.toml

jobs:
  # SP-CI-JOBS-NO-OP-WHEN-NOT-AFFECTED: the workflow always runs. gate
  # selects the jobs the diff affects once and publishes job_<id>, mode
  # and reason; every step of the other jobs but Selection is gated on
  # its own job_<id>, so an unaffected job still runs, still expands its
  # matrix and concludes success under the name repoach requires.
  gate:
    name: gate
    if: >-
      github.event_name != 'pull_request'
      || contains(fromJSON(vars.REPOACH_ALLOWED_ACTORS || '[]'), github.actor)
    runs-on: ${{ vars.REPOACH_RUNNER || 'self-hosted' }}
    env:
      CI_BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
    outputs:
      job_test: ${{ steps.select.outputs.job_test }}
      job_wheel_build: ${{ steps.select.outputs.job_wheel_build }}
      job_wheel_smoke: ${{ steps.select.outputs.job_wheel_smoke }}
      mode: ${{ steps.select.outputs.mode }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - name: Checkout (fresh, no WIP)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch the base branch
        run: git fetch --no-tags origin "$CI_BASE_BRANCH"

      - name: Select the affected jobs (SP-AFFECTED-JOBS-TABLE)
        id: select
        run: >-
          repoach ci affected select
          --table "$REPOACH_AFFECTED_JOBS_TABLE"
          --base "origin/$CI_BASE_BRANCH"
          --event "$GITHUB_EVENT_NAME"
          --base-ref "$GITHUB_BASE_REF"
          --github-output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Lint — edge honesty (SP-ARCH-EDGE-GATE)
        if: github.event_name == 'pull_request'
        run: repoach arch check --base "origin/$CI_BASE_BRANCH"

      - name: Lint — no AI attribution (SP-CONVENTIONS-GATE)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: >-
          python scripts/lint_no_ai_attribution.py
          --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          --text-env PR_TITLE --text-env PR_BODY

      - name: Lint — CONTRIBUTING cites real paths (SP-CONTRIBUTING)
        run: python scripts/check_contributing.py CONTRIBUTING.md

      - name: Pytest — the gate suites ([gate].pytest)
        run: |
          listing="$(repoach ci affected gate-pytest --table "$REPOACH_AFFECTED_JOBS_TABLE")"
          if [[ -z "$listing" ]] ; then
              echo "::notice::gate: [gate].pytest of $REPOACH_AFFECTED_JOBS_TABLE names no selector"
              exit 0
          fi
          mapfile -t selectors <<< "$listing"
          pytest -q "${selectors[@]}" -n auto --dist worksteal

  test:
    name: Test suite (Python ${{ matrix.python-version }})
    # Untrusted PR code runs on a self-hosted runner: gate pull_request
    # events to the maintainer allowlist (push / workflow_dispatch on the
    # protected branches are already trusted). Extend the fromJSON list
    # as collaborators are added — mirrors auto-review.yml.
    if: >-
      github.event_name != 'pull_request'
      || contains(fromJSON(vars.REPOACH_ALLOWED_ACTORS || '[]'), github.actor)
    needs: gate
    runs-on: ${{ vars.REPOACH_RUNNER || 'self-hosted' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Selection
        env:
          AFFECTED: ${{ needs.gate.outputs.job_test }}
          SELECTION_MODE: ${{ needs.gate.outputs.mode }}
          SELECTION_REASON: ${{ needs.gate.outputs.reason }}
        run: |
          case "$AFFECTED" in
              true) verdict="affected" ;;
              false) verdict="not affected" ;;
              *)
                  echo "::error::${GITHUB_JOB}: the gate output for this job is '${AFFECTED}', neither true nor false"
                  exit 1
                  ;;
          esac
          line="${GITHUB_JOB}: ${verdict} by this diff (${SELECTION_MODE}, ${SELECTION_REASON}); selection in the gate job summary"
          printf '::notice::%s\n' "$line"
          printf '%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout (fresh, no WIP)
        if: needs.gate.outputs.job_test == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        if: needs.gate.outputs.job_test == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        if: needs.gate.outputs.job_test == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        if: needs.gate.outputs.job_test == 'true'
        run: ruff check src tests

      - name: Ruff format check
        if: needs.gate.outputs.job_test == 'true'
        run: ruff format --check src tests

      - name: Lint — no inline comments / no noqa (golden rule #6)
        if: needs.gate.outputs.job_test == 'true'
        run: python scripts/lint_no_inline_comments.py --summary

      - name: Lint — no silent except (SP-LINT-LOG-CATCH-ALL)
        if: needs.gate.outputs.job_test == 'true'
        run: python scripts/lint_no_silent_except.py --summary

      # SP-RECORDER-REDACTS-BY-CLASS O2: the maintainer's deny-list
      # (SP-NO-PERSONAL-DATA-GATE D3) lets the fixture deny-list test run.
      # The value reaches the test process only, which prints counts and
      # ordinals, never an entry; GitHub masks it in the log. A fork's
      # pull request gets no secret, the variable is empty and that test
      # skips naming the reason.
      - name: Pytest
        if: needs.gate.outputs.job_test == 'true'
        env:
          REPOACH_PERSONAL_DENYLIST: ${{ secrets.REPOACH_PERSONAL_DENYLIST }}
        run: pytest -q tests/unit -n auto --dist worksteal

      - name: Pytest — integration
        if: needs.gate.outputs.job_test == 'true'
        run: pytest -q tests/integration -n auto --dist worksteal

      - name: Smoke — llm_proxy boots
        if: needs.gate.outputs.job_test == 'true' && matrix.python-version == '3.13'
        # SP-CI-SMOKE-REPAIR: this step had never executed — a stray
        # in-script ``continue-on-error: true`` killed it under bash -e
        # and the step-level flag masked the failure.  It is now a real
        # gate: the boot path (settings load → uvicorn → /health) is
        # the proxy's only end-to-end check.
        env:
          # Loopback + dummy token so the smoke exercises the
          # authenticated configuration (SP-PROXY-SECURE-DEFAULTS
          # refuses tokenless non-loopback binds).
          REPOACH_ANTHROPIC_AUTH_TOKEN: "ci-smoke-token"
          # SP-JOB-PROXY-IS-PRIVATE-TO-ITS-JOB: the smoke shares the
          # self-hosted host with the review jobs, so it picks its own
          # port and proves /health is its own process too.
          JOB_PROXY_DIR: logs/proxy_smoke
          JOB_PROXY_TIMEOUT_S: "30"
        run: |
          set -e
          trap 'bash scripts/job_proxy.sh stop' EXIT
          bash scripts/job_proxy.sh start

  wheel-build:
    name: wheel-build
    if: >-
      github.event_name != 'pull_request'
      || contains(fromJSON(vars.REPOACH_ALLOWED_ACTORS || '[]'), github.actor)
    needs: gate
    runs-on: ${{ vars.REPOACH_RUNNER || 'self-hosted' }}
    steps:
      - name: Selection
        env:
          AFFECTED: ${{ needs.gate.outputs.job_wheel_build }}
          SELECTION_MODE: ${{ needs.gate.outputs.mode }}
          SELECTION_REASON: ${{ needs.gate.outputs.reason }}
        run: |
          case "$AFFECTED" in
              true) verdict="affected" ;;
              false) verdict="not affected" ;;
              *)
                  echo "::error::${GITHUB_JOB}: the gate output for this job is '${AFFECTED}', neither true nor false"
                  exit 1
                  ;;
          esac
          line="${GITHUB_JOB}: ${verdict} by this diff (${SELECTION_MODE}, ${SELECTION_REASON}); selection in the gate job summary"
          printf '::notice::%s\n' "$line"
          printf '%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout (full history, the version comes from the tags)
        if: needs.gate.outputs.job_wheel_build == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          clean: true

      - name: Set up Python 3.13
        if: needs.gate.outputs.job_wheel_build == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Build sdist + wheel
        if: needs.gate.outputs.job_wheel_build == 'true'
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist --wheel --outdir dist/
          twine check dist/*
          ls -l dist/

      - name: Upload dist
        if: needs.gate.outputs.job_wheel_build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  wheel-smoke:
    name: wheel-smoke (${{ matrix.python-version }})
    needs: [gate, wheel-build]
    runs-on: ${{ vars.REPOACH_RUNNER || 'self-hosted' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Selection
        env:
          AFFECTED: ${{ needs.gate.outputs.job_wheel_smoke }}
          SELECTION_MODE: ${{ needs.gate.outputs.mode }}
          SELECTION_REASON: ${{ needs.gate.outputs.reason }}
        run: |
          case "$AFFECTED" in
              true) verdict="affected" ;;
              false) verdict="not affected" ;;
              *)
                  echo "::error::${GITHUB_JOB}: the gate output for this job is '${AFFECTED}', neither true nor false"
                  exit 1
                  ;;
          esac
          line="${GITHUB_JOB}: ${verdict} by this diff (${SELECTION_MODE}, ${SELECTION_REASON}); selection in the gate job summary"
          printf '::notice::%s\n' "$line"
          printf '%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout (full, the smoke script lives in it)
        if: needs.gate.outputs.job_wheel_smoke == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          clean: true

      - name: Download dist
        if: needs.gate.outputs.job_wheel_smoke == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Set up Python ${{ matrix.python-version }}
        if: needs.gate.outputs.job_wheel_smoke == 'true'
        id: py
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: pipx install the wheel and run it outside the checkout
        if: needs.gate.outputs.job_wheel_smoke == 'true'
        run: |
          python -m pip install --upgrade pipx
          PIPX="python -m pipx" bash scripts/wheel_smoke.sh \
            --python "${{ steps.py.outputs.python-path }}" dist/repoach-*.whl
