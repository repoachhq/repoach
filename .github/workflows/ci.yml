name: CI

on:
  push:
    # develop is always reached through a PR that already ran CI (the
    # pull_request trigger below), so a push-CI on develop only re-tests
    # already-gated commits and serialises redundant runs onto the single
    # self-hosted runner. main is kept for develop -> main release validation.
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# SP-CONFIG-ENV-ANCHOR made llm_proxy_base_url fail-loud: Settings now
# refuses to default to a wrong proxy, so every environment must anchor
# the value. CI checks out no .env, so it is anchored here for the whole
# workflow (loopback; the suite mocks the gateway, the smoke boots the
# server which never dials this URL). Step-level env blocks inherit it.
env:
  REPOACH_LLM_PROXY_BASE_URL: http://127.0.0.1:8082

jobs:
  test:
    name: Test suite (Python ${{ matrix.python-version }})
    # Untrusted PR code runs on a self-hosted runner: gate pull_request
    # events to the maintainer allowlist (push / workflow_dispatch on the
    # protected branches are already trusted). Extend the fromJSON list
    # as collaborators are added — mirrors auto-review.yml.
    if: >-
      github.event_name != 'pull_request'
      || contains(fromJSON(vars.REPOACH_ALLOWED_ACTORS || '["jwfaye"]'), github.actor)
    runs-on: ${{ vars.REPOACH_RUNNER || 'self-hosted' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout (fresh, no WIP)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Lint — no inline comments / no noqa (golden rule #6)
        run: python scripts/lint_no_inline_comments.py --summary

      - name: Lint — no silent except (SP-LINT-LOG-CATCH-ALL)
        run: python scripts/lint_no_silent_except.py --summary

      - name: Lint — CONTRIBUTING cites real paths (SP-CONTRIBUTING)
        run: python scripts/check_contributing.py CONTRIBUTING.md

      - name: Lint — no AI attribution (SP-CONVENTIONS-GATE)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: >-
          python scripts/lint_no_ai_attribution.py
          --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          --text-env PR_TITLE --text-env PR_BODY

      - name: Lint — edge honesty (SP-ARCH-EDGE-GATE)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          repoach arch check --base "origin/${{ github.base_ref }}"

      - name: Pytest
        run: pytest -q tests/unit -n auto --dist worksteal

      - name: Pytest — integration
        run: pytest -q tests/integration -n auto --dist worksteal

      - name: Smoke — llm_proxy boots
        if: matrix.python-version == '3.13'
        # SP-CI-SMOKE-REPAIR: this step had never executed — a stray
        # in-script ``continue-on-error: true`` killed it under bash -e
        # and the step-level flag masked the failure.  It is now a real
        # gate: the boot path (settings load → uvicorn → /health) is
        # the proxy's only end-to-end check.
        env:
          # Loopback + dummy token so the smoke exercises the
          # authenticated configuration (SP-PROXY-SECURE-DEFAULTS
          # refuses tokenless non-loopback binds).
          REPOACH_ANTHROPIC_AUTH_TOKEN: "ci-smoke-token"
          # SP-JOB-PROXY-IS-PRIVATE-TO-ITS-JOB: the smoke shares the
          # self-hosted host with the review jobs, so it picks its own
          # port and proves /health is its own process too.
          JOB_PROXY_DIR: logs/proxy_smoke
          JOB_PROXY_TIMEOUT_S: "30"
        run: |
          set -e
          trap 'bash scripts/job_proxy.sh stop' EXIT
          bash scripts/job_proxy.sh start

  wheel-build:
    name: wheel-build
    if: >-
      github.event_name != 'pull_request'
      || contains(fromJSON(vars.REPOACH_ALLOWED_ACTORS || '["jwfaye"]'), github.actor)
    runs-on: ${{ vars.REPOACH_RUNNER || 'self-hosted' }}
    steps:
      - name: Checkout (full history, the version comes from the tags)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          clean: true

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist --wheel --outdir dist/
          twine check dist/*
          ls -l dist/

      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  wheel-smoke:
    name: wheel-smoke (${{ matrix.python-version }})
    needs: wheel-build
    runs-on: ${{ vars.REPOACH_RUNNER || 'self-hosted' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout (full, the smoke script lives in it)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          clean: true

      - name: Download dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Set up Python ${{ matrix.python-version }}
        id: py
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: pipx install the wheel and run it outside the checkout
        run: |
          python -m pip install --upgrade pipx
          PIPX="python -m pipx" bash scripts/wheel_smoke.sh \
            --python "${{ steps.py.outputs.python-path }}" dist/repoach-*.whl
