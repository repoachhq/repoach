name: Re-arm the merge on a review thread

# SP-OPEN-THREADS-BLOCK-THE-MERGE: an open review thread refuses the
# merge, and resolving one fires neither CI nor the review workflow (none
# of the last 300 runs of this repository was started by
# ``pull_request_review_thread``, measured 2026-11-02).  This workflow
# closes that loop: a thread resolved or unresolved dispatches
# ``merge-on-ci.yml`` on main for the PR, whose gate re-reads the threads
# at head, so a green PR whose last thread is closed merges without a
# push.
#
# ``pull_request_review_thread`` runs the workflow file of the PR's
# merge ref, so this file holds no merge-capable token: its job may only
# dispatch a workflow (``actions: write``), and the merge runs from
# main's ``merge-on-ci.yml`` and main's code.  A dispatch made with the
# job token starts a run (workflow_dispatch is the documented exception
# to the GITHUB_TOKEN no-trigger rule) whose actor is
# github-actions[bot], which merge-on-ci.yml admits.  GitHub-hosted, so
# it never holds the self-hosted runner slot.

on:
  pull_request_review_thread:
    types: [resolved, unresolved]

permissions: {}

jobs:
  rearm:
    name: Dispatch the merge gate
    if: >-
      github.event.pull_request.draft != true
      && github.event.pull_request.base.ref == 'develop'
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(fromJSON(vars.REPOACH_ALLOWED_ACTORS || '["jwfaye"]'), github.actor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch merge-on-ci.yml on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: gh workflow run merge-on-ci.yml --repo "$REPOSITORY" --ref main -f pr="$PR_NUMBER"
