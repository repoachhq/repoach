name: Release verify

# SP-RELEASE-SANCTIONED-DEVELOP-MERGE G3 (hand-added — .github/workflows is
# bot-forbidden). On every push to main, verify main's tip matches the
# sanctioned develop->main shape (a fast-forward, or a merge commit whose
# second parent is zero commits ahead of origin/develop's live tip),
# receipt-free via `repoach release verify --live`. A non-zero exit turns
# the check red and fires GitHub's own failed-run notification to repo
# watchers, so an out-of-band or forged merge into main surfaces loudly
# with zero operator action. Push to main is inherently trusted (only a
# maintainer can push the protected branch), so no actor gate is needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # release verify constructs Settings, which fail-loud refuses to default
  # the proxy URL (SP-CONFIG-ENV-ANCHOR); anchor a loopback value for CI.
  REPOACH_LLM_PROXY_BASE_URL: http://127.0.0.1:8082

jobs:
  verify:
    name: Verify main matches the sanctioned develop-to-main shape
    runs-on: ${{ vars.REPOACH_RUNNER || 'self-hosted' }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify sanctioned shape (live)
        run: repoach release verify --live
