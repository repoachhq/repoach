  <text x="45" y="1210" font-size="11" fill="#6b7f95">Wave 1 beats the 2026-07-10 incident at its surfacing root; wave 2 adds push; wave 3 closes the autonomous repair loop. Full rationale, incident replay and open questions: docs/chain_resilience_architecture.md</text>
