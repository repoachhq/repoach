  <text x="495" y="1096" font-size="11" font-weight="bold" fill="#86efac" text-anchor="middle">W1</text>
  <text x="81" y="1101" font-size="14" font-weight="bold" fill="#cbd5e1">chains.env — single source of truth</text>
  <text x="81" y="1123" font-size="11" fill="#9ca3af">Coder-blacklisted: humans or data-driven regeneration only</text>

  <rect x="1085" y="1075" width="350" height="65" rx="10" fill="#101622" stroke="#e879f9" stroke-opacity="0.45"/>
  <rect x="1387" y="1083" width="36" height="18" rx="4" fill="#e879f9" fill-opacity="0.15" stroke="#e879f9" stroke-opacity="0.5"/>
