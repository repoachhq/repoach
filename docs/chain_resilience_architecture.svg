  <text x="81" y="476" font-size="11" fill="#9ca3af">OpenRouter GET /credits, every cycle · floors</text>

  <rect x="435" y="330" width="250" height="72" rx="10" fill="#0d1626" stroke="#335070"/>
  <text x="451" y="356" font-size="14" font-weight="bold" fill="#cbd5e1">nim_health_probe</text>
  <text x="451" y="376" font-size="11" fill="#9ca3af">SQLite — per-tier probe history</text>

  <rect x="745" y="322" width="690" height="188" rx="10" fill="none" stroke="#93c5fd" stroke-opacity="0.45" stroke-dasharray="6 4"/>
  <text x="761" y="346" font-size="12" font-weight="bold" fill="#93c5fd">W2 — custom notification system (transport: operator design, not Claude routines)</text>

  <rect x="765" y="362" width="200" height="76" rx="10" fill="#101622" stroke="#263041"/>
  <text x="781" y="386" font-size="13" font-weight="bold" fill="#cbd5e1">rate-based detector</text>
  <text x="781" y="404" font-size="10.5" fill="#9ca3af">x% of last M probes not-ok,</text>
  <text x="781" y="420" font-size="10.5" fill="#9ca3af">slow counted · hysteresis</text>

  <rect x="1005" y="362" width="175" height="76" rx="10" fill="#0d1626" stroke="#335070"/>
  <text x="1021" y="386" font-size="13" font-weight="bold" fill="#cbd5e1">health_events</text>
  <text x="1021" y="404" font-size="10.5" fill="#9ca3af">dedup · correlation key</text>
  <text x="1021" y="420" font-size="10.5" fill="#9ca3af">subject retirement</text>

  <rect x="1220" y="362" width="195" height="76" rx="10" fill="#101622" stroke="#263041"/>
  <text x="1236" y="386" font-size="13" font-weight="bold" fill="#cbd5e1">Notifier port</text>
  <text x="1236" y="404" font-size="10.5" fill="#9ca3af">→ custom transport</text>
  <text x="1236" y="420" font-size="10.5" fill="#9ca3af">(push, operator-owned)</text>

  <text x="765" y="470" font-size="10.5" fill="#6b7f95">also in W2: containment layer becomes an emitter (quarantine escalations, chain fell to tail)</text>
  <text x="765" y="488" font-size="10.5" fill="#6b7f95">provider-agnostic head probes close the non-NIM blind spot (today: STATUS_SKIPPED = unmonitored)</text>

