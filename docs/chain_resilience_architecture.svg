  <text x="81" y="202" font-size="11" fill="#9ca3af">per-tier 24 h rates (slow counted in the bad column) · breaker state</text>
  <text x="81" y="220" font-size="11" fill="#9ca3af">cell freshness age · credits · “tier unmonitored” warning</text>

  <rect x="575" y="152" width="330" height="90" rx="10" fill="#101622" stroke="#263041"/>
  <text x="591" y="180" font-size="14" font-weight="bold" fill="#cbd5e1">GET /health</text>
  <text x="591" y="202" font-size="11" fill="#9ca3af">breaker snapshot (ref · reason · TTL · strikes)</text>
  <text x="591" y="220" font-size="11" fill="#9ca3af">+ credits field (W1)</text>

  <rect x="935" y="152" width="500" height="90" rx="10" fill="#101622" stroke="#263041"/>
  <text x="951" y="180" font-size="14" font-weight="bold" fill="#cbd5e1">GitHub PRs — factory review</text>
  <text x="951" y="202" font-size="11" fill="#9ca3af">Architect · Sentinel · Tester · Scribe → evidence-first merge gate</text>
  <text x="951" y="220" font-size="11" fill="#9ca3af">→ auto-merge to develop</text>

  <!-- ======================= BAND 2: DETECTION ======================= -->
  <rect x="45" y="285" width="1410" height="240" rx="14" fill="#0d1117" stroke="#1f2937" stroke-width="1.2"/>
  <text x="65" y="313" font-size="13" font-weight="bold" fill="#64748b" letter-spacing="2">DETECTION</text>

  <rect x="65" y="330" width="310" height="72" rx="10" fill="#101622" stroke="#263041"/>
  <text x="81" y="356" font-size="14" font-weight="bold" fill="#cbd5e1">monitor-chains</text>
  <text x="81" y="376" font-size="11" fill="#9ca3af">systemd timer, 15 min — probes each tier’s head</text>

  <rect x="65" y="430" width="310" height="72" rx="10" fill="#101622" stroke="#263041"/>
  <rect x="327" y="438" width="36" height="18" rx="4" fill="#86efac" fill-opacity="0.15" stroke="#86efac" stroke-opacity="0.5"/>
