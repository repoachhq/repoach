  <text x="1281" y="988" font-size="10.5" fill="#9ca3af">invariants validator</text>
  <text x="1281" y="1005" font-size="10.5" fill="#9ca3af">onset + recovery hysteresis</text>

  <rect x="65" y="1075" width="460" height="65" rx="10" fill="#101622" stroke="#263041"/>
