  <text x="761" y="941" font-size="14" font-weight="bold" fill="#cbd5e1">freshness guard</text>
  <text x="761" y="963" font-size="11" fill="#9ca3af">since=lookback · refuse to conclude</text>
  <text x="761" y="981" font-size="11" fill="#9ca3af">on stale cells, loudly</text>

