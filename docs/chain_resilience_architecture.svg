  <text x="81" y="963" font-size="11" fill="#9ca3af">chain-relevant cells only · per-provider caps</text>
  <text x="81" y="981" font-size="11" fill="#9ca3af">429 = observer interference · credits-aware skip</text>

  <rect x="455" y="915" width="230" height="72" rx="10" fill="#0d1626" stroke="#335070"/>
  <text x="471" y="941" font-size="14" font-weight="bold" fill="#cbd5e1">cell_health_probe</text>
  <text x="471" y="963" font-size="11" fill="#9ca3af">SQLite — per-cell health</text>

  <rect x="745" y="915" width="280" height="80" rx="10" fill="#101622" stroke="#263041"/>
  <rect x="977" y="923" width="36" height="18" rx="4" fill="#86efac" fill-opacity="0.15" stroke="#86efac" stroke-opacity="0.5"/>
