  <text x="1101" y="1101" font-size="14" font-weight="bold" fill="#cbd5e1">reload + breaker reconciliation</text>
  <text x="1101" y="1123" font-size="11" fill="#9ca3af">cache-clear endpoint · clear stale trips · re-seed</text>

