  <!-- ======================= BAND 3: CONTAINMENT ======================= -->
  <rect x="45" y="550" width="1410" height="295" rx="14" fill="#0d1117" stroke="#1f2937" stroke-width="1.2"/>
  <text x="65" y="578" font-size="13" font-weight="bold" fill="#64748b" letter-spacing="2">CONTAINMENT — LLM_PROXY LIVE DISPATCH</text>

  <rect x="65" y="605" width="110" height="55" rx="10" fill="#101622" stroke="#263041"/>
  <text x="120" y="637" font-size="13" font-weight="bold" fill="#cbd5e1" text-anchor="middle">client</text>

  <rect x="235" y="592" width="340" height="82" rx="10" fill="#101622" stroke="#263041"/>
  <text x="251" y="618" font-size="14" font-weight="bold" fill="#cbd5e1">ModelRouter.resolve_chain</text>
  <text x="251" y="640" font-size="11" fill="#9ca3af">filters tripped refs out of the tier chain</text>
  <text x="251" y="658" font-size="11" fill="#9ca3af">walks remaining hops on failure</text>

  <rect x="645" y="592" width="400" height="82" rx="10" fill="#101622" stroke="#263041"/>
  <text x="661" y="618" font-size="14" font-weight="bold" fill="#cbd5e1">breaker — per (provider, model) ref</text>
  <text x="661" y="640" font-size="11" fill="#9ca3af">TTL: transient 120 s · quarantine 6 h · terminal 7 d</text>
  <text x="661" y="658" font-size="11" fill="#9ca3af">3-strike escalation, counter survives TTL lapse</text>

  <rect x="1095" y="592" width="330" height="72" rx="10" fill="#101622" stroke="#263041"/>
  <text x="1111" y="618" font-size="14" font-weight="bold" fill="#cbd5e1">probe_seed — proxy startup</text>
  <text x="1111" y="640" font-size="11" fill="#9ca3af">pre-trips breaker from nim_health_probe</text>

  <rect x="235" y="712" width="340" height="75" rx="10" fill="#101622" stroke="#263041"/>
  <text x="251" y="738" font-size="14" font-weight="bold" fill="#cbd5e1">fault → classify → trip</text>
  <text x="251" y="760" font-size="11" fill="#9ca3af">timeout · 5xx · 429 · empty completion · 4xx</text>

  <rect x="645" y="712" width="400" height="98" rx="10" fill="#101622" stroke="#263041"/>
  <rect x="997" y="720" width="36" height="18" rx="4" fill="#86efac" fill-opacity="0.15" stroke="#86efac" stroke-opacity="0.5"/>
  <text x="1015" y="733" font-size="11" font-weight="bold" fill="#86efac" text-anchor="middle">W1</text>
  <text x="661" y="738" font-size="14" font-weight="bold" fill="#cbd5e1">slow-strike (shadow-first)</text>
  <text x="661" y="760" font-size="11" fill="#9ca3af">slow success = strike, not recover()</text>
  <text x="661" y="778" font-size="11" fill="#9ca3af">separate k-of-n counter · never hard-quarantine</text>
  <text x="661" y="796" font-size="11" fill="#9ca3af">latency gate + tps floor · budget-retry path covered</text>

  <rect x="1095" y="690" width="330" height="130" rx="10" fill="none" stroke="#9ca3af" stroke-opacity="0.5" stroke-dasharray="5 4"/>
  <text x="1111" y="714" font-size="13" font-weight="bold" fill="#9ca3af">parked: provider-scope quarantine</text>
  <text x="1111" y="736" font-size="10.5" fill="#6b7f95">transports fold upstream 4xx into SSE errors —</text>
  <text x="1111" y="753" font-size="10.5" fill="#6b7f95">provider_402 never reaches _trip_breaker (dead code);</text>
  <text x="1111" y="770" font-size="10.5" fill="#6b7f95">prereq: PeekResult.upstream_error_status plumbing.</text>
  <text x="1111" y="787" font-size="10.5" fill="#6b7f95">If revived: 402-only, claude_code tail exempt,</text>
  <text x="1111" y="804" font-size="10.5" fill="#6b7f95">empty chain → existing 502 (no head resurrection)</text>

