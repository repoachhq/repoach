constraints:
  source_max_age_days: 90

products:
  - name: repoach
    vendor_url: https://github.com/repoachhq/repoach
    loop:
      value: review bench, adversarial refuter, merge gate
      source_url: https://github.com/repoachhq/repoach/blob/45712b2c257905c8c0377872dc204462e8969a3b/src/repoach/review/refuter.py
      checked_on: 2026-10-21
    forges:
      value: GitHub, GitLab
      source_url: https://github.com/repoachhq/repoach/tree/45712b2c257905c8c0377872dc204462e8969a3b/src/repoach/forge
      checked_on: 2026-10-21
    blocks_merge_on_evidence:
      value: "yes: refuses an unproven LGTM"
      source_url: https://github.com/repoachhq/repoach/blob/45712b2c257905c8c0377872dc204462e8969a3b/src/repoach/review/merge_gate.py
      checked_on: 2026-10-21
    reverifies_at_merge_head:
      value: "yes: the ledger is re-verified at the exact head"
      source_url: https://github.com/repoachhq/repoach/blob/45712b2c257905c8c0377872dc204462e8969a3b/src/repoach/review/merge_gate.py
      checked_on: 2026-10-21
    spec_gates_plan:
      value: "yes: governed spec; the plan's tests must exist at the head"
      source_url: https://github.com/repoachhq/repoach/blob/45712b2c257905c8c0377872dc204462e8969a3b/src/repoach/review/spec_gate.py
      checked_on: 2026-10-21
    model_choice:
      value: Claude Code login, Anthropic key, OpenAI-compatible presets, Gemini, gateway
      source_url: https://github.com/repoachhq/repoach/blob/45712b2c257905c8c0377872dc204462e8969a3b/src/repoach/providers/select.py
      checked_on: 2026-10-21
    price:
      value: free (MIT); you pay your model, no token resale
      source_url: https://github.com/repoachhq/repoach/blob/45712b2c257905c8c0377872dc204462e8969a3b/LICENSE
      checked_on: 2026-10-21
    self_host:
      value: "yes: your CI or your machine; no repoach cloud"
      source_url: https://github.com/repoachhq/repoach/blob/45712b2c257905c8c0377872dc204462e8969a3b/src/repoach/ci_entry/snippets.py
      checked_on: 2026-10-21

