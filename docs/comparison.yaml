pr_sources:
  - name: OpenHands
    line: an autonomous developer that opens PRs; repoach reviews and gates them.
  - name: Devin
    line: an autonomous developer that opens PRs; repoach reviews and gates them.
  - name: SWE-agent
    line: an agent that turns an issue into a patch; repoach reviews and gates the PR.
  - name: Aider
    line: a local coding assistant whose commits reach a PR; repoach reviews and gates it.

