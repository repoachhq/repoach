[project]
name = "repoach"
version = "0.1.0"
description = "The self-forging software factory — an autonomous, self-evolving multi-agent dev platform."
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Joseph Faye" }]

# Genesis reset: dependencies cover the surviving review factory only
# (review/ + agent_engine/ + llm/ + llm_proxy/ + core/ + cli/ + lint/).
# The rebuilt system reintroduces its own dependencies as it lands.
dependencies = [
    "httpx[http2]>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "loguru>=0.7",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # llm_proxy (ingested from free-claude-code)
    "openai>=2.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.108",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/repoachhq/repoach"
Repository = "https://github.com/repoachhq/repoach"
Issues = "https://github.com/repoachhq/repoach/issues"

[project.scripts]
repoach = "repoach.cli:app"
ferova = "repoach.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repoach"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "N",             # pep8-naming
    "SIM",           # simplify
    "D",             # pydocstyle (Google style configured below)
    "RUF",           # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "D100",   # missing docstring in public module (allow lightweight modules)
    "D104",   # missing docstring in public package
    "D105",   # missing docstring in magic method (we cover the obvious ones)
    "D107",   # missing docstring in __init__ (covered by class docstring)
    "D203",   # 1 blank line before class docstring (conflicts with D211)
    "D213",   # multi-line summary on second line (conflicts with D212)
    "RUF001", # en-dashes in identifiers (we use typographic dashes deliberately)
    "RUF002", # en-dashes in docstrings (idem)
    "RUF003", # en-dashes in comments (idem)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["repoach"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"scripts/**/*.py" = ["D"]
# Ingested LLM proxy (formerly free-claude-code) — keep upstream style.
"src/repoach/llm_proxy/**/*.py" = ["D", "B", "SIM", "UP", "N", "RUF"]
# SP-NO-INLINE-COMMENTS-GATE — suppressions migrated from inline ``# noqa`` directives.
# Domain-specific exception class names that don't end in "Error" — renaming
# would break public API consumers.
"src/repoach/agent_engine/adapters.py" = ["N818"]
# typer.Argument()/Option() defaults are the documented idiom; B008 fires
# on every CLI declaration otherwise.
"src/repoach/cli/main.py" = ["B008"]
"src/repoach/arch/cli.py" = ["B008"]
# Test fixtures need late imports / unused imports for stub plumbing.
"tests/unit/test_review_notifier.py" = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
